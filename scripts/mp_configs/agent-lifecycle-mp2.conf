#!/usr/bin/env bash
# Merge Point Configuration: agent-lifecycle MP2 (Frontend Complete)
# Used by: scripts/execute_merge_point.sh

MP_ID="MP2"
WORKSTREAM="agent-lifecycle"
WORKSTREAM_DIR="docs/workstreams/agent-lifecycle"

# Git worktree / branch configuration
WORKTREE_PATH="/Users/imaxxs/repositories/deepsecure-mvp-frontend"
WORKTREE_BRANCH="feature/agent-lifecycle-frontend"
TARGET_BRANCH="feature/frontend-architecture"
COMMIT_MSG="feat(agent-lifecycle): lifecycle badges, deploy config, session history UI"
MERGE_MSG="merge: agent-lifecycle frontend (Track B) — lifecycle badge + deploy config + session history"

# Directory prefix to sync from main repo to worktree
SYNC_PREFIX="frontend/"

# Test commands (run from repo root, before merge)
UNIT_TESTS=(
    "cd frontend && npx vitest run src/components/agents/__tests__/LifecycleBadge.test.tsx src/components/agents/__tests__/LifecycleProgressBar.test.tsx src/components/agents/__tests__/DeployConfigSection.test.tsx src/components/agents/__tests__/SessionHistoryTable.test.tsx"
)
INTEGRATION_TESTS=(
    "cd frontend && npx vitest run 'src/app/(dashboard)/dashboard/agents/__tests__/page.test.tsx' 'src/app/(dashboard)/dashboard/agents/[id]/activity/__tests__/page.test.tsx'"
)
REGRESSION_TESTS=(
    "cd frontend && npx tsc --noEmit"
)
VERIFY_INTEGRATION="python scripts/verify_integration.py --warn-only"

# Container / Build deployment — frontend uses npm build, not Docker
MIGRATION_CMD=""
BUILD_CMD="cd frontend && npm run build"
RESTART_CMD=""
HEALTH_URL=""

# Additional deploy steps (run after build)
DEPLOY_STEPS=(
    "cd frontend && npx tsc --noEmit"
)

# Smoke tests — frontend-specific (no API_BASE = skip API smoke tests)
API_BASE=""
SMOKE_TESTS=(
    "cd frontend && npx vitest run --reporter=verbose 2>&1 | tail -5 | grep -q 'Test Files.*passed'"
    "test -d frontend/.next"
)

# No Alembic for frontend merge points
EXPECTED_ALEMBIC_REV=""

# No DB check for frontend
DB_CHECK_CMD=""

# Custom success criteria
SUCCESS_CRITERIA=(
    "cd frontend && npm run build"
    "cd frontend && npx tsc --noEmit"
)
